<template id="logo"><svg viewBox="0 0 48 48"><path d="M24 3 42 13.5v21L24 45 6 34.5v-21Z" fill="#1b0b33" stroke="#a855f7" stroke-width="2.5"/><path d="M16 33V16l16 17V19" fill="none" stroke="#e9d5ff" stroke-width="4"/><path d="m32 10 3.5 3.5L32 17l-3.5-3.5Z" fill="#22d3ee"/></svg></template>

<script>
const $ = (id) => document.getElementById(id);
$('mais').onclick = () => {
  $('menu-mais').hidden = !$('menu-mais').hidden;
};

$('think').onchange = () => {
  $('menu-mais').hidden = true;
};
const ler = (chave, padrao) => { try { return JSON.parse(localStorage.getItem(chave)) ?? padrao; } catch { return padrao; } };
const gravar = (chave, valor) => { try { localStorage.setItem(chave, JSON.stringify(valor)); } catch {} };

const config = Object.assign({ nome: '', tamanho: 'normal', criatividade: 0.3, fonte: '15px', extra: '', linguagem: '' }, ler('nyra-config', {}));
let conversas = ler('nyra-conversas', []);
let atual = conversas[0] || { mensagens: [] };
let parar = null;

const elemento = (tag, classe, texto) => {
  const el = document.createElement(tag);
  if (classe) el.className = classe;
  if (texto !== undefined) el.textContent = texto;
  return el;
};
const logo = () => $('logo').content.firstElementChild.cloneNode(true);
const salvar = () => gravar('nyra-conversas', conversas);
const rolar = () => $('chat').scrollTop = $('chat').scrollHeight;

function copiar(botao, texto) {
  navigator.clipboard.writeText(texto).then(() => {
    const antes = botao.textContent;
    botao.textContent = 'Copiado!';
    setTimeout(() => botao.textContent = antes, 1500);
  });
}
function botao(texto, acao, classe) {
  const b = elemento('button', classe, texto);
  b.type = 'button';
  b.onclick = () => acao(b);
  return b;
}
function formatar(el, texto) {
  el.textContent = '';
  texto.split('```').forEach((parte, i) => {
    if (i % 2 === 0) return el.append(parte);
    const codigo = parte.replace(/^[\w+#-]*\n/, '');
    el.append(elemento('pre', '', codigo), botao('Copiar código', (b) => copiar(b, codigo)));
  });
}
function desenharMensagem(m) {
  const caixa = elemento('div', m.role);
  const quem = elemento('div', 'quem');
  if (m.role === 'assistant') quem.append(logo(), 'Nyra');
  else quem.append(config.nome || 'Você');
  quem.append(elemento('time', '', m.hora));
  const texto = elemento('div', 'texto');
  if (m.role === 'assistant') formatar(texto, m.content);
  else texto.textContent = m.content;
  caixa.append(quem, texto);
  $('chat').append(caixa);
  return { caixa, texto };
}
function acoes(caixa, m) {
  const div = elemento('div', 'acoes');
  div.append(
    botao('Copiar resposta', (b) => copiar(b, m.content)),
    botao('Continuar', () => enviar('Continue a resposta anterior exatamente de onde parou, sem repetir o que já foi escrito.'), 'continuar'));
  caixa.append(div);
}
function desenhar() {
  $('chat').textContent = '';
  $('titulo').textContent = atual.mensagens[0]?.content || 'Nova conversa';
  if (!atual.mensagens.length) {
    const v = elemento('div', 'vazio');
    v.append(logo(), elemento('h1', '', 'NYRA CODE AI'), elemento('p', '', 'Beyond the code.'));
    return $('chat').append(v);
  }
  for (const m of atual.mensagens) {
    const { caixa } = desenharMensagem(m);
    if (m.role === 'assistant') acoes(caixa, m);
  }
  rolar();
}
function listar() {
  $('lista').textContent = '';
  for (const c of conversas) {
    const linha = elemento('div', 'conversa' + (c === atual ? ' atual' : ''));
    linha.append(
      botao(c.mensagens[0]?.content || 'Conversa', () => { trocar(c); $('menu').close(); }),
      botao('✕', () => {
        if (!confirm('Apagar essa conversa?')) return;
        conversas = conversas.filter((x) => x !== c);
        if (c === atual) trocar({ mensagens: [] });
        salvar();
        listar();
      }));
    $('lista').append(linha);
  }
}
function trocar(c) {
  parar?.abort();
  atual = c;
  desenhar();
}

async function enviar(pergunta) {
  if (parar || !pergunta) return;
  const conversa = atual;
  const hora = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  if (!conversa.mensagens.length) conversas.unshift(conversa);
  conversa.mensagens.push({ role: 'user', content: pergunta, hora: hora() });
  salvar();
  desenhar();
  const resposta = { role: 'assistant', content: '', hora: hora() };
  const { caixa, texto } = desenharMensagem(resposta);
  parar = new AbortController();
  $('enviar').textContent = 'Parar';
  const inicio = Date.now();
  const relogio = () => $('processando').textContent = 'Nyra está processando há ' + Math.round((Date.now() - inicio) / 1000) + 's';
  relogio();
  const timer = setInterval(relogio, 1000);
  $('processando').style.display = 'block';
  rolar();
  let erro = '';
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: parar.signal,
      body: JSON.stringify({
  ...config,
  mensagens: conversa.mensagens,
  pensar: $('think').checked
})
    });
    if (!r.ok) throw new Error(await r.text());
    const leitor = r.body.pipeThrough(new TextDecoderStream()).getReader();
    while (true) {
      const { value, done } = await leitor.read();
      if (done) break;
      const noFim = $('chat').scrollHeight - $('chat').scrollTop - $('chat').clientHeight < 80;
      resposta.content += value;
      formatar(texto, resposta.content);
      if (noFim) rolar();
    }
  } catch (e) {
    if (e.name !== 'AbortError') erro = e.message;
  }
  clearInterval(timer);
  $('processando').style.display = 'none';
  $('enviar').textContent = 'Enviar';
  parar = null;
  if (resposta.content) {
    conversa.mensagens.push(resposta);
    acoes(caixa, resposta);
  }
  if (erro) texto.append(elemento('p', '', 'Deu ruim: ' + erro));
  else if (!resposta.content) texto.textContent = 'Sem resposta.';
  salvar();
}

$('caixa').onsubmit = (e) => {
  e.preventDefault();
  if (parar) return parar.abort();
  const pergunta = $('campo').value.trim();
  $('campo').value = '';
  enviar(pergunta);
};
$('novo').onclick = () => trocar({ mensagens: [] });
$('abrirMenu').onclick = () => { listar(); $('menu').showModal(); };
$('abrirConfig').onclick = () => { $('menu').close(); $('config').showModal(); };
document.querySelectorAll('[data-fechar]').forEach((b) => b.onclick = () => b.closest('dialog').close());
$('config').onclose = desenharSeParado;
function desenharSeParado() { if (!parar) desenhar(); }
$('apagarTudo').onclick = () => {
  if (!confirm('Apagar TODAS as conversas?')) return;
  conversas = [];
  salvar();
  trocar({ mensagens: [] });
};
function aplicar() {
  document.documentElement.style.setProperty('--fonte', config.fonte);
  $('valor').textContent = config.criatividade;
}
for (const chave of Object.keys(config)) {
  $(chave).value = config[chave];
  $(chave).oninput = () => {
    config[chave] = $(chave).value;
    gravar('nyra-config', config);
    aplicar();
  };
}
fetch('/status').then((r) => r.json()).then((s) => {
  $('status').textContent = s.chave ? '● Servidor ligado, API configurada' : '● Falta a chave da Groq';
  $('modelo').textContent = s.modelo;
}).catch(() => $('status').textContent = '● Servidor desligado');
aplicar();
desenhar();
</script>

<script>
(() => {
  const emLinha = (el, linha) => {
    linha.split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach((p, i) => {
      if (i % 2 === 0) return el.append(p);
      if (p[0] === '`') el.append(elemento('code', '', p.slice(1, -1)));
      else emLinha(el.appendChild(elemento('strong')), p.slice(2, -2));
    });
  };
  formatar = (el, texto) => {
    el.textContent = '';
    texto.split(/^[ \t]*```/m).forEach((parte, i) => {
      if (i % 2) {
        const codigo = parte.replace(/^[\w+#-]*\n/, '');
        return el.append(elemento('pre', '', codigo), botao('Copiar código', (b) => copiar(b, codigo)));
      }
      parte.replace(/^\n+|\s+$/g, '').split('\n').forEach((linha, j, todas) => {
        const cab = linha.match(/^#{1,6}\s+(.*)/);
        if (/^\s*---+\s*$/.test(linha)) return el.append(document.createElement('hr'));
        if (cab) return emLinha(el.appendChild(elemento('strong', 'cab')), cab[1]);
        emLinha(el, linha.replace(/^(\s*)[-*]\s+/, '$1• '));
        if (j < todas.length - 1) el.append('\n');
      });
    });
  };
  const b = document.getElementById('enviar');
  new MutationObserver(() => b.classList.toggle('parando', b.textContent === 'Parar')).observe(b, { childList: true });
  document.getElementById('campo').rows = 1;
  desenhar();
})();
</script>

<script>
(() => {
  const girar = (cor, r, g, b, a, d) => {
    const M = Math.max(r, g, b), m = Math.min(r, g, b), D = M - m;
    if (!D) return cor;
    let h = 60 * (M === r ? ((g - b) / D + 6) % 6 : M === g ? (b - r) / D + 2 : (r - g) / D + 4);
    if (h < 180 || h > 300) return cor;
    const L = (M + m) / 510, S = D / 255 / (1 - Math.abs(2 * L - 1));
    return "hsl(" + (h + d + 360) % 360 + " " + S * 100 + "% " + L * 100 + "% / " + a + ")";
  };
  const pintar = (css, d) => css.replace(/#([0-9a-f]{8}|[0-9a-f]{6}|[0-9a-f]{3,4})(?![\w-])/gi, (cor, n) => {
    if (n.length < 5) n = [...n].map((k) => k + k).join("");
    const [r, g, b, a = 255] = n.match(/../g).map((k) => parseInt(k, 16));
    return girar(cor, r, g, b, a / 255, d);
  }).replace(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/g, (cor, r, g, b, a = 1) => girar(cor, +r, +g, +b, a, d));
  window.nyraPintar = pintar;
})();
</script>

<script>
(() => {
  const sel = document.getElementById("linguagem");
  if (!sel) return;
  const INFO = window.nyraLing || {};
  const faisca = "<svg viewBox=0,0,24,24><path d=M11,4l2,5l5,2l-5,2l-2,5l-2,-5l-5,-2l5,-2ZM19,15v5M16.5,17.5h5></path></svg>";
  const novo = (tag, texto = "") => { const e = document.createElement(tag); e.textContent = texto; return e; };
  const selo = (v) => {
    const [t, cor] = INFO[v] || [v.slice(0, 2), "#c084fc"], e = novo("i", t);
    e.className = "selo"; e.style.cssText = "font-style:normal;--c:" + cor;
    if (!v) e.innerHTML = faisca;
    return e;
  };
  const pilula = novo("button"), d = novo("dialog"), grade = novo("div");
  pilula.type = "button"; pilula.id = "ling"; d.id = "linguas"; grade.className = "grade";
  d.append(novo("u"), novo("h3", "Escolha a linguagem"), grade); document.body.append(d); sel.before(pilula); sel.style.setProperty("display", "none", "important");
  const ver = () => pilula.replaceChildren(selo(sel.value), novo("span", sel.value || "Automática"));
  pilula.onclick = () => {
    grade.replaceChildren(...[...sel.options].map((o, i) => {
      const b = novo("button"), t = novo("span");
      b.type = "button"; b.className = o.value === sel.value ? "on" : ""; b.style.animationDelay = i * 45 + "ms";
      t.append(novo("b", o.value || "Automática"), novo("small", (INFO[o.value] || [])[2] || ""));
      b.append(selo(o.value), t);
      b.onclick = () => { sel.value = o.value; for (const n of ["input", "change"]) sel.dispatchEvent(new Event(n, { bubbles: true })); ver(); d.close(); };
      return b;
    }));
    d.showModal();
  };
  d.onclick = (e) => { if (e.clientY < d.getBoundingClientRect().top) d.close(); };
  sel.addEventListener("change", ver); ver();
  if (window.nyraAplicar) nyraAplicar();
})();
</script>

<script>
(() => {
  const a = document.getElementById("abre");
  if (!a) return;
  const v = window.nyraV || { anim: true, ritmo: 1 };
  if (!v.anim) return a.remove();
  const t = a.querySelector("small");
  [[900, "Carregando módulos..."], [1700, "Conectando o cérebro..."], [2400, "Tudo pronto"]].forEach(([ms, s]) => setTimeout(() => t.textContent = s, ms / v.ritmo));
  a.onclick = () => a.classList.add("pula");
  a.addEventListener("animationend", (e) => { if (e.target === a) a.remove(); });
  if (window.nyraAplicar) nyraAplicar();
})();

<script>
(() => {
  const ler = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
  window.nyraMem = { ler: () => ler("nyra-memoria"), salvar: (l) => localStorage.setItem("nyra-memoria", JSON.stringify(l.slice(-25))) };
  const gatilhos = ["lembra que", "lembre que", "lembre-se", "guarda que", "anota que", "meu nome", "eu prefiro", "eu gosto", "eu uso", "sempre responda"];
  const antigo = window.fetch;
  window.fetch = (url, op) => {
    if (url !== "/chat") return antigo(url, op);
    const msgs = JSON.parse(op.body).mensagens, nova = msgs[msgs.length - 1].content, m = nyraMem.ler();
    if (nova.length <= 220 && gatilhos.some((g) => nova.toLowerCase().includes(g)) && !m.includes(nova)) { m.push(nova); nyraMem.salvar(m); }
    const antes = ler("nyra-conversas").map((c) => (c.mensagens[0] || {}).content || "").filter((t) => t && t !== msgs[0].content).slice(0, 5).map((t) => t.slice(0, 80));
    const marca = document.getElementById("think") || document.querySelector(".nyra-pop input[type=checkbox]");
    const info = { pensar: Boolean(marca && marca.checked), memoria: m.join(" | ").slice(-1000), antes: antes.join(" | ") };
    return antigo(url, { ...op, headers: { ...op.headers, "x-nyra": encodeURIComponent(JSON.stringify(info)) } });
  };
})();
</script>

<script>
(() => {
  const novo = (t, x = "") => { const e = document.createElement(t); e.textContent = x; return e; };
  const botao = (x, f) => { const b = novo("button", x); b.type = "button"; b.onclick = f; return b; };
  const d = novo("dialog"), lista = novo("div"), campo = novo("input");
  d.id = "memoria"; campo.placeholder = "Ex: eu prefiro Python";
  const ver = () => {
    const m = nyraMem.ler();
    lista.replaceChildren(...m.map((t, i) => { const l = novo("p"); l.append(novo("span", t), botao("×", () => { m.splice(i, 1); nyraMem.salvar(m); ver(); })); return l; }));
    if (!m.length) lista.append(novo("p", "Nada guardado ainda"));
  };
  const guardar = botao("Guardar", () => { const t = campo.value.trim().slice(0, 220); if (!t) return; nyraMem.salvar([...nyraMem.ler(), t]); campo.value = ""; ver(); });
  const limpar = botao("Apagar tudo", () => {
    if (limpar.textContent === "Apagar tudo") return limpar.textContent = "Toque de novo pra apagar";
    nyraMem.salvar([]); limpar.textContent = "Apagar tudo"; ver();
  });
  guardar.className = "principal";
  d.append(novo("h3", "Memória da Nyra"), novo("small", "Diga no chat: lembra que... ou escreva aqui"), lista, campo, guardar, limpar, botao("Fechar", () => d.close()));
  document.body.append(d);
  const abrir = botao("Memória da Nyra", () => { limpar.textContent = "Apagar tudo"; ver(); d.showModal(); });
  abrir.id = "abrirMemoria";
  abrir.insertAdjacentHTML("afterbegin", "<svg class=ic viewBox=0,0,24,24><path d=M6,4h12v16l-6,-4l-6,4Z></path></svg>");
  const ref = document.getElementById("abrirVisual");
  if (ref) ref.after(abrir); else (document.getElementById("menu") || document.body).append(abrir);
  if (window.nyraAplicar) nyraAplicar();
})();
</script>
