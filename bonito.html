<style>
#chat{mask-image:linear-gradient(#0000,#000 32px,#000 calc(100% - var(--base,0px) - 28px),#000c calc(100% - var(--base,0px) + 24px),#0007)}
header{position:relative}
header::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:1px;background:linear-gradient(90deg,#0000,#a855f7,#22d3ee,#0000)}
#titulo{background:linear-gradient(90deg,#e9d5ff,#67e8f9);background-clip:text;color:transparent}
.texto{text-shadow:0 1px 4px #000}
.user .texto{background:linear-gradient(135deg,#4c1d95d9,#2b1250d9);box-shadow:0 4px 18px #7c3aed45}
#enviar{background:linear-gradient(135deg,#c084fc,#7c3aed);box-shadow:0 0 18px #a855f780}
.bloco{margin:12px 0 4px;border:1px solid #a855f755;border-radius:16px;overflow:hidden;background:#0b0618c4;backdrop-filter:blur(3px);box-shadow:0 0 22px #7c3aed30}
.topo{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 2px 14px;background:#2a1650b3;font:600 .75em monospace;color:#c4b5fd}
.topo button{background:none;border:0;color:#22d3ee;padding:10px}
.bloco pre{margin:0;border:0;border-radius:0;background:none;font-size:.82em;line-height:1.7;text-shadow:none}
.bloco .k{color:#c084fc}.bloco .s{color:#67e8f9}.bloco .c{color:#8b7db0;font-style:italic}.bloco .n{color:#f9a8d4}
